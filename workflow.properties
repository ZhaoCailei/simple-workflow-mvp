# ============================================================
# Workflow 流程定义文件
# 想改流程？只改这个文件即可，不用改 Java 代码。
#
# 字段说明：
#   name       流程名称（显示用）
#   entry      从哪个节点开始
#   maxSteps   最多执行多少步（防止配置错误导致死循环）
#   maxRetries 节点执行失败后的重试次数
#
#   每个节点三个字段：
#   node.N.id     节点编号（唯一）
#   node.N.agent  用哪个 Agent（对应 Main.java 里注册的名字）
#   node.N.next   下一个节点；留空表示流程结束
#
# 小实验：把 node.2.next 改成空，流程就变成
#        “需求 -> 设计”，编码节点不会被执行，Java 代码一行都不用改。
# ============================================================

name=Mini SE 流程（需求 -> 设计 -> 编码）
entry=requirement
maxSteps=10
maxRetries=2

node.1.id=requirement
node.1.agent=requirement
node.1.next=design

node.2.id=design
node.2.agent=design
node.2.next=code

node.3.id=code
node.3.agent=code
node.3.next=
